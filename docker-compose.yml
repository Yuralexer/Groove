services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=groove_db
      - POSTGRES_USER=groove_user
      - POSTGRES_PASSWORD=groove_pass
    ports:
      - "5432:5432"
    
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    
  backend:
    build: ./backend
    command: /app/entrypoint.sh
    volumes:
      - ./backend:/app
      - /app/.venv
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=groove_db
      - DB_USER=groove_user
      - DB_PASSWORD=groove_pass
      - DJANGO_SECRET_KEY=django-insecure-test-key-change-me
      - DEBUG=1
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  media_volume:
  redis_data: